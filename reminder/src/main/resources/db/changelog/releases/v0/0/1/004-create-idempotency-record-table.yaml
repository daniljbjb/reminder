databaseChangeLog:
  - changeSet:
      id: 001-create-idempotency-record-table
      author: chatgpt
      changes:
        - createTable:
            tableName: idempotency_record
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_idempotency_record
                    nullable: false

              - column:
                  name: idempotency_key
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: true

              - column:
                  name: reminder_id
                  type: BIGINT

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: idempotency_record
            columnNames: user_id, idempotency_key
            constraintName: uk_idempotency_record_user_idempotency_key