databaseChangeLog:
  - changeSet:
      id: 001-create-user-seq
      author: danil
      changes:
        - createSequence:
            sequenceName: user_seq
            startValue: 1
            incrementBy: 15

  - changeSet:
      id: 002-create-users-table
      author: danil
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueSequenceNext: user_seq
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
                    nullable: false

              - column:
                  name: public_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: provider
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: provider_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        # Уникальный public_id (то, что пойдет в JWT sub)
        - addUniqueConstraint:
            tableName: users
            columnNames: public_id
            constraintName: uk_users_public_id

        # Уникальная связка provider + provider_id (например GOOGLE + sub)
        - addUniqueConstraint:
            tableName: users
            columnNames: provider,provider_id
            constraintName: uk_users_provider_provider_id

        # CHECK: защита от пустых строк (через SQL, т.к. addCheckConstraint не поддерживается)
        - sql:
            dbms: postgresql
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE users
                ADD CONSTRAINT chk_users_provider_not_empty
                CHECK (provider <> '');

              ALTER TABLE users
                ADD CONSTRAINT chk_users_provider_id_not_empty
                CHECK (provider_id <> '');

              ALTER TABLE users
                ADD CONSTRAINT chk_users_email_not_empty
                CHECK (email <> '');

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: true
            sql: |
              ALTER TABLE users DROP CONSTRAINT IF EXISTS chk_users_provider_not_empty;
              ALTER TABLE users DROP CONSTRAINT IF EXISTS chk_users_provider_id_not_empty;
              ALTER TABLE users DROP CONSTRAINT IF EXISTS chk_users_email_not_empty;

        - dropTable:
            tableName: users
        - dropSequence:
            sequenceName: user_seq