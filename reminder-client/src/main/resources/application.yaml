spring:
  application:
    name: reminder-client

server:
  port: 8081
  
  
reminder:
  rest:
    base-url: http://localhost:8080
    
auth:
  base-url: http://localhost:8082
  public-login-url: ${AUTH_PUBLIC_BASE_URL:http://localhost:8082}/oauth2/authorization/google
  client-id: client-service
  client-secret: ${AUTH_CLIENT_SECRET}
  exchange-path: /api/auth/exchange
    
    
security:
  jwt:
    issuer: auth-service
    audience: reminder-client
    rsa:
      cookie-name: ACCESS_TOKEN
      cookie-secure: ${JWT_COOKIE_SECURE:true}
      cookie-max-age: ${JWT_COOKIE_MAX_AGE:15m}
